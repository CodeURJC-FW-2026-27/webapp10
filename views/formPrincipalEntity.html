<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <title>GamePortal - {{#edit}}Editar{{/edit}}{{^edit}}Añadir{{/edit}} juego</title>

  <!-- Bootstrap core CSS -->
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Additional CSS Files -->
  <link rel="stylesheet" href="/css/templatemo-lugx-gaming.css">

</head>

<body>

  <!-- ***** Preloader Start ***** -->
  <div id="js-preloader" class="js-preloader">

    <div class="preloader-inner">

      <span class="dot"></span>

      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>
  <!-- ***** Preloader End ***** -->


  {{>header}}
  <!-- ***** Header Area End ***** -->


  <!-- ***** Page Heading Start ***** -->
  <div class="page-heading header-text">

    <div class="container">

      <div class="row">

        <div class="col-lg-12">

          <h3>{{#edit}}Editar{{/edit}}{{^edit}}Añadir{{/edit}} juego</h3>

          <span class="breadcrumb">
            <a href="/">Inicio</a> > {{#edit}}Editar{{/edit}}{{^edit}}Añadir{{/edit}} juego
          </span>

        </div>

      </div>

    </div>

  </div>
  <!-- ***** Page Heading End ***** -->


  <!-- ***** Form Page Start ***** -->
  <div class="contact-page section">

    <div class="container">

      <form action="{{action}}" method="post" enctype="multipart/form-data">

        <div class="row justify-content-center">

          <div class="col-md-8">

            <div class="card-body p-4">


              <!--Step content -->

              <!-- Step 1 -->
              <div class="tab-content">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Datos principales
                        </h2>


                        <!-- Title -->
                        <div class="mb-3">

                          <label class="form-label" for="title">
                            Título
                          </label>

                          <input type="text" class="form-control" name="title" id="title"  placeholder="Título del juego" required value="{{title}}">

                        </div>


                        <!-- Developer -->
                        <div class="mb-3">

                          <label class="form-label" for="developer">
                            Desarrollador
                          </label>

                          <input type="text" class="form-control" name="developer" id="developer" 
                            placeholder="Desarrollador del juego" required value="{{developer}}">

                        </div>


                        <!-- Description -->
                        <div class="mb-3">

                          <label class="form-label" for="description">
                            Descripción
                          </label>

                          <textarea class="form-control" rows="5" name="description" id="description"
                            placeholder="Descripción del juego" required>{{description}}</textarea>

                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>


              <!-- Step 2 -->

              <div class="tab-content mt-4">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Detalles
                        </h2>


                        <div class="row">
                          <!-- Year -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label" for="year">
                              Año de lanzamiento
                            </label>

                            <select id="year" name="year" class="form-select" required value="{{launch_age}}" >

                              <option value="" disabled selected>
                                Selecciona un año
                              </option>

                              <option value="2026" {{#eq_2026}}selected{{/eq_2026}}>2026</option>
                              <option value="2025" {{#eq_2025}}selected{{/eq_2025}}>2025</option>
                              <option value="2024" {{#eq_2024}}selected{{/eq_2024}}>2024</option>
                              <option value="2023" {{#eq_2023}}selected{{/eq_2023}}>2023</option>
                              <option value="2022" {{#eq_2022}}selected{{/eq_2022}}>2022</option>
                              <option value="2021" {{#eq_2021}}selected{{/eq_2021}}>2021</option>
                              <option value="2020" {{#eq_2020}}selected{{/eq_2020}}>2020</option>
                              <option value="2019" {{#eq_2019}}selected{{/eq_2019}}>2019</option>
                              <option value="2018" {{#eq_2018}}selected{{/eq_2018}}>2018</option>
                              <option value="2017" {{#eq_2017}}selected{{/eq_2017}}>2017</option>
                              <option value="2016" {{#eq_2016}}selected{{/eq_2016}}>2016</option>
                              <option value="2015" {{#eq_2015}}selected{{/eq_2015}}>2015</option>
                              <option value="2014" {{#eq_2014}}selected{{/eq_2014}}>2014</option>
                              <option value="2013" {{#eq_2013}}selected{{/eq_2013}}>2013</option>
                              <option value="2012" {{#eq_2012}}selected{{/eq_2012}}>2012</option>
                              <option value="2011" {{#eq_2011}}selected{{/eq_2011}}>2011</option>
                              <option value="2010" {{#eq_2010}}selected{{/eq_2010}}>2010</option>
                              <option value="2009" {{#eq_2009}}selected{{/eq_2009}}>2009</option>
                              <option value="2008" {{#eq_2008}}selected{{/eq_2008}}>2008</option>
                              <option value="2007" {{#eq_2007}}selected{{/eq_2007}}>2007</option>
                              <option value="2006" {{#eq_2006}}selected{{/eq_2006}}>2006</option>
                              <option value="2005" {{#eq_2005}}selected{{/eq_2005}}>2005</option>
                              <option value="2004" {{#eq_2004}}selected{{/eq_2004}}>2004</option>
                              <option value="2003" {{#eq_2003}}selected{{/eq_2003}}>2003</option>
                              <option value="2002" {{#eq_2002}}selected{{/eq_2002}}>2002</option>
                              <option value="2001" {{#eq_2001}}selected{{/eq_2001}}>2001</option>
                              <option value="2000" {{#eq_2000}}selected{{/eq_2000}}>2000</option>
                              <option value="1999" {{#eq_1999}}selected{{/eq_1999}}>1999</option>
                              <option value="1998" {{#eq_1998}}selected{{/eq_1998}}>1998</option>
                              <option value="1997" {{#eq_1997}}selected{{/eq_1997}}>1997</option>
                              <option value="1996" {{#eq_1996}}selected{{/eq_1996}}>1996</option>
                              <option value="1995" {{#eq_1995}}selected{{/eq_1995}}>1995</option>
                              <option value="1994" {{#eq_1994}}selected{{/eq_1994}}>1994</option>
                              <option value="1993" {{#eq_1993}}selected{{/eq_1993}}>1993</option>
                              <option value="1992" {{#eq_1992}}selected{{/eq_1992}}>1992</option>
                              <option value="1991" {{#eq_1991}}selected{{/eq_1991}}>1991</option>
                              <option value="1990" {{#eq_1990}}selected{{/eq_1990}}>1990</option>
                              <option value="1989" {{#eq_1989}}selected{{/eq_1989}}>1989</option>
                              <option value="1988" {{#eq_1988}}selected{{/eq_1988}}>1988</option>
                              <option value="1987" {{#eq_1987}}selected{{/eq_1987}}>1987</option>
                              <option value="1986" {{#eq_1986}}selected{{/eq_1986}}>1986</option>
                              <option value="1985" {{#eq_1985}}selected{{/eq_1985}}>1985</option>
                              <option value="1984" {{#eq_1984}}selected{{/eq_1984}}>1984</option>
                              <option value="1983" {{#eq_1983}}selected{{/eq_1983}}>1983</option>
                              <option value="1982" {{#eq_1982}}selected{{/eq_1982}}>1982</option>
                              <option value="1981" {{#eq_1981}}selected{{/eq_1981}}>1981</option>
                              <option value="1980" {{#eq_1980}}selected{{/eq_1980}}>1980</option>
                              <option value="1979" {{#eq_1979}}selected{{/eq_1979}}>1979</option>
                              <option value="1978" {{#eq_1978}}selected{{/eq_1978}}>1978</option>

                              <option value="1975" {{#eq_1975}}selected{{/eq_1975}}>1975</option>

                              <option value="1967" {{#eq_1967}}selected{{/eq_1967}}>1967</option>
                              <option value="1966" {{#eq_1966}}selected{{/eq_1966}}>1966</option>
                              <option value="1965" {{#eq_1965}}selected{{/eq_1965}}>1965</option>
                              <option value="1964" {{#eq_1964}}selected{{/eq_1964}}>1964</option>
                              <option value="1963" {{#eq_1963}}selected{{/eq_1963}}>1963</option>
                              <option value="1962" {{#eq_1962}}selected{{/eq_1962}}>1962</option>
                              <option value="1961" {{#eq_1961}}selected{{/eq_1961}}>1961</option>
                              <option value="1960" {{#eq_1960}}selected{{/eq_1960}}>1960</option>
                              <option value="1959" {{#eq_1959}}selected{{/eq_1959}}>1959</option>
                              <option value="1958" {{#eq_1958}}selected{{/eq_1958}}>1958</option>
                              <option value="1957" {{#eq_1957}}selected{{/eq_1957}}>1957</option>
                              <option value="1956" {{#eq_1956}}selected{{/eq_1956}}>1956</option>
                              <option value="1955" {{#eq_1955}}selected{{/eq_1955}}>1955</option>
                              <option value="1954" {{#eq_1954}}selected{{/eq_1954}}>1954</option>
                              <option value="1953" {{#eq_1953}}selected{{/eq_1953}}>1953</option>
                              <option value="1952" {{#eq_1952}}selected{{/eq_1952}}>1952</option>
                              <option value="1951" {{#eq_1951}}selected{{/eq_1951}}>1951</option>
                              <option value="1950" {{#eq_1950}}selected{{/eq_1950}}>1950</option>

                            </select>

                          </div>


                          <!-- PEGI -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label" for="pegi">
                              PEGI
                            </label>

                            <select id="pegi" name="pegi" class="form-select" required >

                              <option value="" disabled selected>
                                Selecciona un PEGI
                              </option>

                              <option value="Sin clasificar" {{#eq_Sin calificar}}selected{{/eq_Sin calificar}}> 
                                Sin clasificar
                              </option>

                              <option value="3" {{#eq_3}}selected{{/eq_3}}> 
                                PEGI 3
                              </option>

                              <option value="7" {{#eq_7}}selected{{/eq_7}}> 
                                PEGI 7
                              </option>

                              <option value="12" {{#eq_12}}selected{{/eq_12}}>
                                PEGI 12
                              </option>

                              <option value="16" {{#eq_16}}selected{{/eq_16}}> 
                                PEGI 16
                              </option>

                              <option value="18" {{#eq_18}}selected{{/eq_18}}> 
                                PEGI 18
                              </option>

                            </select>

                          </div>

                        </div>


                        <!-- Categories -->
                        <div class="mb-3">

                          <label class="form-label">
                            Categoría
                          </label>

                          <div class="border rounded p-3">

                            <div class="row">


                              <!-- Action -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="action" name="action"
                                    value="action" {{#genre_object.Accion}}checked{{/genre_object.Accion}}>
                                  <label class="form-check-label" for="action">

                                    Acción

                                  </label>

                                </div>

                              </div>


                              <!-- RPG -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="rpg" name="rpg" value="rpg" {{#genre_object.RPG}}checked{{/genre_object.RPG}}>

                                  <label class="form-check-label" for="rpg">

                                    RPG

                                  </label>

                                </div>

                              </div>

                              <!-- Puzzle -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="puzzle" name="puzzle" value="puzzle" {{#genre_object.Puzle}}checked{{/genre_object.Puzle}}>

                                  <label class="form-check-label" for="puzzle">

                                    Puzle

                                  </label>

                                </div>

                              </div>

                              <!-- Strategy -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="strategy" name="strategy" value="strategy" {{#genre_object.Estrategia}}checked{{/genre_object.Estrategia}}>

                                  <label class="form-check-label" for="strategy">

                                    Estrategia

                                  </label>

                                </div>

                              </div>

                              <!-- Shooters -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="shooters" name="shooters" value="shooters" {{#genre_object.Disparos}}checked{{/genre_object.Disparos}}>

                                  <label class="form-check-label" for="shooters">

                                    Disparos

                                  </label>

                                </div>

                              </div>

                              <!-- Adventure -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="adventure" name="adventure" value="adventure" {{#genre_object.Aventura}}checked{{/genre_object.Aventura}}>

                                  <label class="form-check-label" for="adventure">

                                    Aventura

                                  </label>

                                </div>

                              </div>

                              <!-- Multiplayer -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="multiplayer" name="multiplayer" value="multiplayer" {{#genre_object.Multijugador}}checked{{/genre_object.Multijugador}}>

                                  <label class="form-check-label" for="multiplayer">

                                    Multijugador

                                  </label>

                                </div>

                              </div>

                              

                              <!-- Car -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="car" name="car" value="car" {{#genre_object.Carreras}}checked{{/genre_object.Carreras}}>

                                  <label class="form-check-label" for="car">

                                    Coches

                                  </label>

                                </div>

                              </div>


                              <!-- Terror -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="terror" name="terror"
                                    value="terror" {{#genre_object.Terror}}checked{{/genre_object.Terror}}>

                                  <label class="form-check-label" for="terror">

                                    Terror

                                  </label>

                                </div>

                              </div>

                            </div>

                          </div>

                        </div>

                        <!-- Platforms -->
                        <div class="mb-3">

                          <label class="form-label">
                            Plataformas
                          </label>

                          <div class="border rounded p-3">

                            <div class="row">


                              <!-- PC -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="pc" name="pc" value="pc" {{#platform_object.PC}}checked{{/platform_object.PC}}>
                                  <label class="form-check-label" for="pc">
                                    PC
                                  </label>

                                </div>

                              </div>


                              <!-- PS4 -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="PS4" name="PS4" value="PS4" {{#platform_object.PS4}}checked{{/platform_object.PS4}}>

                                  <label class="form-check-label" for="PS4">

                                    PS4

                                  </label>

                                </div>

                              </div>


                              <!-- PS5 -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="PS5" name="PS5" value="PS5" {{#platform_object.PS5}}checked{{/platform_object.PS5}}>

                                  <label class="form-check-label" for="PS5">

                                    PS5

                                  </label>

                                </div>

                              </div>


                              <!-- XBOX -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="XBOX" name="XBOX" value="XBOX" {{#platform_object.XBOX}}checked{{/platform_object.XBOX}}>

                                  <label class="form-check-label" for="XBOX">

                                    XBOX

                                  </label>

                                </div>

                              </div>

                              <!-- Nintendo Switch -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="nintendoSwitch"
                                    name="nintendoSwitch" value="Nintendo Switch" {{#platform_object.Nintendo Switch}}checked{{/platform_object.Nintendo Switch}}>

                                  <label class="form-check-label" for="nintendoSwitch">

                                    Nintendo Switch

                                  </label>

                                </div>

                              </div>

                              <!-- Mobile phone -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="mobilePhone" name="mobilePhone"
                                    value="Telefono movil" {{#platform_object.Telefono movil}}checked{{/platform_object.Telefono movil}}>

                                  <label class="form-check-label" for="mobilePhone">

                                    Teléfono movil

                                  </label>

                                </div>

                              </div>

                            </div>

                          </div>

                        </div>


                        <!-- Link -->
                        <div class="mb-3">

                          <label class="form-label" for="link">
                            Enlace de compra
                          </label>

                          <input type="url" class="form-control" name="link"  id="link"
                            placeholder="Enlace de compra del juego" required value = "{{link}}">

                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>


              <!-- Step 3 -->

              <div class="tab-content mt-4">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Imágenes
                        </h2>


                        <div class="mb-3">

                          <label class="form-label" for="cover">
                            Carátula del juego
                          </label>

                          <input type="file" class="form-control" {{^edit}}required{{/edit}} value={{cover}} id="cover" name="cover" accept="image/*">

                        </div>

                        <div class="mb-3">

                          <label class="form-label" for="scene">
                            Escenas del juego
                          </label>

                          <input type="file" class="form-control" {{^edit}}required{{/edit}} value={{scene}} id="scene" name="scene" accept="image/*" multiple>

                        </div>

    {{#edit}}
    <label class="form-label mb-3 d-block text-center" for="scene">
        Escenas actuales
    </label>

    <div class="d-flex flex-wrap gap-3 justify-content-center">
        {{#scene}}
            <div class="text-center">
                <img src="/image?filename={{.}}" 
                     class="rounded img-fluid"
                     style="width: 180px; height: 120px; object-fit: cover;">

                <div class="mt-2">
                    <div class="form-check d-flex justify-content-center align-items-center gap-2">
                        <input type="checkbox"
                               class="form-check-input m-0"
                               name="removeScene"
                               value="{{.}}">
                        <label class="form-check-label">
                            Quitar imagen
                        </label>
                    </div>
                </div>
            </div>
        {{/scene}}
    </div>
{{/edit}}





                      </div>
                    </div>
                  </div>
                </div>
              </div>


              <!-- Step 4 -->

              <div class="tab-content mt-4">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Confirmación
                        </h2>


                        <div class="alert alert-info">

                          Revisa los datos antes de enviar el formulario.

                        </div>


                        <div class="form-check mb-4 ">

                          <input class="form-check-input" required type="checkbox" id="acept" name="acept" >

                          <label class="form-check-label" for="acept">

                            Acepto los términos y condiciones

                          </label>

                          <div class="d-flex justify-content-between mt-4">

                            <a href="/" class="btn btn-secondary">
                              Cancelar
                            </a>

                            <button type="submit" class="btn btn-success">

                              Guardar

                            </button>

                          </div>

                        </div>

                      </div>
                    </div>
                  </div>
                </div>
              </div>


            </div>
          </div>
        </div>
      </form>
    </div>

  </div>

  <!-- ***** Contact Page End ***** -->


  <!-- ***** Footer Start ***** -->
  {{> footer}}
  <!-- ***** Footer End ***** -->


  <!-- Scripts -->

  <!-- Bootstrap core JavaScript -->
  <script src="/js/custom.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
