<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <title>GamePortal - Añadir Reseña</title>

  <!-- Bootstrap core CSS -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Additional CSS Files -->
  <link rel="stylesheet" href="assets/css/fontawesome.css">
  <link rel="stylesheet" href="assets/css/templatemo-lugx-gaming.css">
  <link rel="stylesheet" href="assets/css/owl.css">
  <link rel="stylesheet" href="assets/css/animate.css">
  <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css">

</head>

<body>

  <!-- ***** Preloader Start ***** -->
  <div id="js-preloader" class="js-preloader">

    <div class="preloader-inner">

      <span class="dot"></span>

      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>
  <!-- ***** Preloader End ***** -->


  <!-- ***** Header Area Start ***** -->
  <header class="header-area header-sticky">

    <div class="container">

      <div class="row">
        <div class="col-12">
          <nav class="main-nav">
            <!-- ***** Logo Start ***** -->
            <a href="index.html" class="logo"> <!--class="chr-logo"-->
              <img src="assets/images/logo.png" alt="" style="width: 180px;">
            </a>
            <!-- ***** Logo End ***** -->
            <!-- ***** Menu Start ***** -->
            <ul class="nav">
              <li><a href="index.html#popular-games">Juegos</a></li>
              <li>
                <div class="chg">
                  <div class="search-input caption">
                    <form id="search" action="index.html#popular-games">
                      <input type="text" placeholder="Nombre del juego" id='searchText' name="searchKeyword"
                        onkeypress="handle" />
                      <button role="button">Buscar</button>
                    </form>
                  </div>
                </div>
              </li>
            </ul>
            <a class='menu-trigger'>
              <span>Menu</span>
            </a>
            <!-- ***** Menu End ***** -->
          </nav>
        </div>
      </div>
    </div>
  </header>
  <!-- ***** Header Area End ***** -->


  <!-- ***** Page Heading Start ***** -->
  <div class="page-heading header-text">

    <div class="container">

      <div class="row">

        <div class="col-lg-12">

          <h3>Añadir Reseña</h3>

          <span class="breadcrumb">
            <a href="index.html">Inicio</a> > Añadir Reseña
          </span>

        </div>

      </div>

    </div>

  </div>
  <!-- ***** Page Heading End ***** -->


  <!-- ***** Contact Page Start ***** -->
  <div class="contact-page section">

    <div class="container">

      <form action="index.html" method="post">

        <div class="row justify-content-center">

          <div class="col-md-8">

            <div class="card-body p-4">


              <!--Step content -->

              <!-- Step 1 -->
              <div class="tab-content">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Datos principales
                        </h2>


                        <!-- User -->
                        <div class="mb-3">

                          <label class="form-label" for="username">
                            Nombre de usuario
                          </label>

                          <input type="text" class="form-control" name="username" id="username" required
                            placeholder="Nombre de usuario">

                        </div>



                        <div class="row">
                          <!-- game -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label" for="game">
                              Juego
                            </label>

                            <select id="game" name="game" class="form-select" required>

                              <option value="" disabled selected>
                                Selecciona un juego
                              </option>

                              <option value="amnesia">Amnesia: The Dark Descent</option>
                              <option value="miside">MiSide</option>
                              <option value="imnotahuman">I'm Not a Human</option>
                              <option value="cuphead">Cuphead</option>
                              <option value="eldenring">Elden Ring</option>
                              <option value="doom">Doom</option>
                              <option value="outlast">Outlast</option>
                              <option value="titanfall2">Titanfall 2</option>
                              <option value="dbd">Dead by Daylight</option>
                              <option value="wolfenstein">Wolfenstein: The New Order</option>
                              <option value="madmax">Mad Max</option>
                              <option value="control">Control</option>

                            </select>

                          </div>


                          <!-- publication_date -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label" for="publication_date">
                              Fecha de publicación
                            </label>

                            <input type="date" class="form-control" name="publication_date" required
                              id="publication_date" placeholder="Fecha de publicación del juego">

                          </div>

                        </div>

                        <!-- Comment -->
                        <div class="mb-3">

                          <label class="form-label" for="comment">
                            Comentario
                          </label>

                          <textarea class="form-control" rows="5" name="comment" required id="comment"
                            placeholder="Comentario"></textarea>

                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>


              <!-- Step 2 -->

              <div class="tab-content mt-4">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Puntuación
                        </h2>


                        <div class="row">
                          <!-- Jugability -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label" for="jugability">
                              Jugabilidad
                            </label>

                            <select id="jugability" name="jugability" class="form-select" required>
                              <option value="1">Mala</option>
                              <option value="2">Regular</option>
                              <option value="3">Buena</option>
                              <option value="4">Muy buena</option>
                              <option value="5">Excelente</option>
                            </select>

                          </div>

                          <!-- Graphics -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label" for="graphics">
                              Gráficos
                            </label>

                            <select id="graphics" name="graphics" class="form-select" required>
                              <option value="1">Mala</option>
                              <option value="2">Regular</option>
                              <option value="3">Buena</option>
                              <option value="4">Muy buena</option>
                              <option value="5">Excelente</option>
                            </select>

                          </div>
                          <!-- History -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label" for="history">
                              Historia
                            </label>

                            <select id="history" name="history" class="form-select" required>
                              <option value="1">Mala</option>
                              <option value="2">Regular</option>
                              <option value="3">Buena</option>
                              <option value="4">Muy buena</option>
                              <option value="5">Excelente</option>
                            </select>
                          </div>

                          <!-- Precio -->

                          <div class="col-md-6 mb-3">

                            <label class="form-label" for="price">
                              Precio
                            </label>

                            <select id="price" name="price" class="form-select" required>
                              <option value="1">Muy Caro</option>
                              <option value="2">Caro</option>
                              <option value="3">Calidad-Precio</option>
                              <option value="4">Un buen precio</option>
                              <option value="5">Muy barato</option>
                            </select>

                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Step 4 -->

              <div class="tab-content mt-4">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Confirmación
                        </h2>


                        <div class="alert alert-info">

                          Revisa los datos antes de enviar el formulario.

                        </div>


                        <div class="form-check mb-4 ">

                          <input class="form-check-input" type="checkbox" id="aceptar" name="aceptar" required>

                          <label class="form-check-label" for="aceptar">

                            Acepto los términos y condiciones

                          </label>

                          <div class="d-flex justify-content-between mt-4">

                            <a href="product-details.html" class="btn btn-secondary">
                              Cancelar
                            </a>

                            <button type="submit" class="btn btn-success">

                              Guardar

                            </button>

                          </div>

                        </div>

                      </div>
                    </div>
                  </div>
                </div>
              </div>


            </div>
            <!-- Fin tab-content -->


          </div>
          <!-- Fin card-body -->

        </div>
        <!-- Fin col-md-8 -->

    </div>
    <!-- Fin row -->
    </form>

  </div>
  <!-- Fin container -->

  </div>
  <!-- ***** Contact Page End ***** -->


  <!-- ***** Footer Start ***** -->
  <footer>
    <div class="container">
      <div class="col-lg-12">
        <p>Copyright © 2026 GamePortal. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>
  <!-- ***** Footer End ***** -->


  <!-- Scripts -->

  <!-- Bootstrap core JavaScript -->
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.min.js"></script>

  <script src="assets/js/isotope.min.js"></script>
  <script src="assets/js/owl-carousel.js"></script>
  <script src="assets/js/counter.js"></script>
  <script src="assets/js/custom.js"></script>

</body>

</html>
