<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"

  <title>Lugx Gaming - Añadir juego</title>

  <!-- Bootstrap core CSS -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Additional CSS Files -->
  <link rel="stylesheet" href="assets/css/fontawesome.css">
  <link rel="stylesheet" href="assets/css/templatemo-lugx-gaming.css">
  <link rel="stylesheet" href="assets/css/owl.css">
  <link rel="stylesheet" href="assets/css/animate.css">
  <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css">

</head>

<body>

  <!-- ***** Preloader Start ***** -->
  <div id="js-preloader" class="js-preloader">

    <div class="preloader-inner">

      <span class="dot"></span>

      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>
  <!-- ***** Preloader End ***** -->


  <!-- ***** Header Area Start ***** -->
  <header class="header-area header-sticky">

    <div class="container">

      <div class="row">
        <div class="col-12">
          <nav class="main-nav">
            <!-- ***** Logo Start ***** -->
            <a href="index.html" class="logo"> <!--class="chr-logo"-->
              <img src="assets/images/logo.png" alt="" style="width: 180px;">
            </a>
            <!-- ***** Logo End ***** -->
            <!-- ***** Menu Start ***** -->
            <ul class="nav">
              <li><a href="index.html#popular-games">Juegos</a></li>
              <li>
                <div class="chg">
                  <div class="search-input caption">
                    <form id="search" action="#">
                      <input type="text" placeholder="Nombre del juego" id='searchText' name="searchKeyword"
                        onkeypress="handle" />
                      <button role="button">Buscar</button>
                    </form>
                  </div>
                </div>
              </li>
            </ul>
            <a class='menu-trigger'>
              <span>Menu</span>
            </a>
            <!-- ***** Menu End ***** -->
          </nav>
        </div>
      </div>
    </div>
  </header>
  <!-- ***** Header Area End ***** -->


  <!-- ***** Page Heading Start ***** -->
  <div class="page-heading header-text">

    <div class="container">

      <div class="row">

        <div class="col-lg-12">

          <h3>Añadir juego</h3>

          <span class="breadcrumb">
            <a href="index.html">Inicio</a> > Añadir juego
          </span>

        </div>

      </div>

    </div>

  </div>
  <!-- ***** Page Heading End ***** -->


  <!-- ***** Contact Page Start ***** -->
  <div class="contact-page section">

    <div class="container">

      <form action="index.html" method="post">

        <div class="row justify-content-center">

          <div class="col-md-8">

            <div class="card-body p-4">


              <!--Step content -->

              <!-- Step 1 -->
              <div class="tab-content">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Datos principales
                        </h2>


                        <!-- Title -->
                        <div class="mb-3">

                          <label class="form-label">
                            Título
                          </label>

                          <input type="text" class="form-control" name="title" required placeholder="Título del juego">

                        </div>


                        <!-- Developer -->
                        <div class="mb-3">

                          <label class="form-label">
                            Desarrollador
                          </label>

                          <input type="text" class="form-control" name="developer" required
                            placeholder="Desarrollador del juego">

                        </div>


                        <!-- Description -->
                        <div class="mb-3">

                          <label class="form-label">
                            Descripción
                          </label>

                          <textarea class="form-control" rows="5" name="description"
                            placeholder="Descripción del juego"></textarea>

                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>


              <!-- Step 2 -->

              <div class="tab-content mt-4">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Detalles
                        </h2>


                        <div class="row">
                          <!-- Year -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label">
                              Año de lanzamiento
                            </label>

                            <select id="year" name="year" class="form-select" required>

                              <option value="" disabled selected>
                                Selecciona un año
                              </option>

                              <option value="2026">2026</option>
                              <option value="2025">2025</option>
                              <option value="2024">2024</option>
                              <option value="2023">2023</option>
                              <option value="2022">2022</option>
                              <option value="2021">2021</option>
                              <option value="2020">2020</option>
                              <option value="2019">2019</option>
                              <option value="2018">2018</option>
                              <option value="2017">2017</option>
                              <option value="2016">2016</option>
                              <option value="2015">2015</option>
                              <option value="2014">2014</option>
                              <option value="2013">2013</option>
                              <option value="2012">2012</option>
                              <option value="2011">2011</option>
                              <option value="2010">2010</option>
                              <option value="2009">2009</option>
                              <option value="2008">2008</option>
                              <option value="2007">2007</option>
                              <option value="2006">2006</option>
                              <option value="2005">2005</option>
                              <option value="2004">2004</option>
                              <option value="2003">2003</option>
                              <option value="2002">2002</option>
                              <option value="2001">2001</option>
                              <option value="2000">2000</option>
                              <option value="1999">1999</option>
                              <option value="1998">1998</option>
                              <option value="1997">1997</option>
                              <option value="1996">1996</option>
                              <option value="1995">1995</option>
                              <option value="1994">1994</option>
                              <option value="1993">1993</option>
                              <option value="1992">1992</option>
                              <option value="1991">1991</option>
                              <option value="1990">1990</option>
                              <option value="1989">1989</option>
                              <option value="1988">1988</option>
                              <option value="1987">1987</option>
                              <option value="1986">1986</option>
                              <option value="1985">1985</option>
                              <option value="1984">1984</option>
                              <option value="1983">1983</option>
                              <option value="1982">1982</option>
                              <option value="1981">1981</option>
                              <option value="1980">1980</option>
                              <option value="1979">1979</option>
                              <option value="1978">1978</option>
                              <option value="1977">1977</option>
                              <option value="1976">1976</option>
                              <option value="1975">1975</option>
                              <option value="1974">1974</option>
                              <option value="1973">1973</option>
                              <option value="1972">1972</option>
                              <option value="1971">1971</option>
                              <option value="1970">1970</option>
                              <option value="1969">1969</option>
                              <option value="1968">1968</option>
                              <option value="1967">1967</option>
                              <option value="1966">1966</option>
                              <option value="1965">1965</option>
                              <option value="1964">1964</option>
                              <option value="1963">1963</option>
                              <option value="1962">1962</option>
                              <option value="1961">1961</option>
                              <option value="1960">1960</option>
                              <option value="1959">1959</option>
                              <option value="1958">1958</option>
                              <option value="1957">1957</option>
                              <option value="1956">1956</option>
                              <option value="1955">1955</option>
                              <option value="1954">1954</option>
                              <option value="1953">1953</option>
                              <option value="1952">1952</option>
                              <option value="1951">1951</option>
                              <option value="1950">1950</option>

                            </select>

                          </div>


                          <!-- PEGI -->
                          <div class="col-md-6 mb-3">

                            <label class="form-label">
                              PEGI
                            </label>

                            <select id="pegi" name="pegi" class="form-select" required>

                              <option value="" disabled selected>
                                Selecciona un PEGI
                              </option>

                              <option value="Sin clasificar">
                                Sin clasificar
                              </option>

                              <option value="3">
                                PEGI 3
                              </option>

                              <option value="7">
                                PEGI 7
                              </option>

                              <option value="12">
                                PEGI 12
                              </option>

                              <option value="16">
                                PEGI 16
                              </option>

                              <option value="18">
                                PEGI 18
                              </option>

                            </select>

                          </div>

                        </div>


                        <!-- Categories -->
                        <div class="mb-3">

                          <label class="form-label">
                            Categoría
                          </label>

                          <div class="border rounded p-3">

                            <div class="row">


                              <!-- Action -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="action" name="action"
                                    value="action">
                                  <label class="form-check-label" for="action">

                                    Acción

                                  </label>

                                </div>

                              </div>


                              <!-- RPG -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="rpg" name="rpg" value="rpg">

                                  <label class="form-check-label" for="rpg">

                                    RPG

                                  </label>

                                </div>

                              </div>


                              <!-- Car -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="car" name="car" value="car">

                                  <label class="form-check-label" for="car">

                                    Coches

                                  </label>

                                </div>

                              </div>


                              <!-- Terror -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="terror" name="terror"
                                    value="terror">

                                  <label class="form-check-label" for="terror">

                                    Terror

                                  </label>

                                </div>

                              </div>

                            </div>

                          </div>

                        </div>

                        <!-- Platforms -->
                        <div class="mb-3">

                          <label class="form-label">
                            Plataformas
                          </label>

                          <div class="border rounded p-3">

                            <div class="row">


                              <!-- PC -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="pc" name="pc" value="pc">
                                  <label class="form-check-label" for="pc">
                                    PC
                                  </label>

                                </div>

                              </div>


                              <!-- PS4 -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="PS4" name="PS4" value="PS4">

                                  <label class="form-check-label" for="PS4">

                                    PS4

                                  </label>

                                </div>

                              </div>


                              <!-- PS5 -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="PS5" name="PS5" value="PS5">

                                  <label class="form-check-label" for="PS5">

                                    PS5

                                  </label>

                                </div>

                              </div>


                              <!-- XBOX -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="XBOX" name="XBOX" value="XBOX">

                                  <label class="form-check-label" for="XBOX">

                                    XBOX

                                  </label>

                                </div>

                              </div>

                              <!-- Nintendo Switch -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="nintendoSwitch"
                                    name="Nintendo Switch" value="Nintendo Switch">

                                  <label class="form-check-label" for="Nintendo Switch">

                                    Nintendo Switch

                                  </label>

                                </div>

                              </div>

                              <!-- Mobile phone -->
                              <div class="col-6">

                                <div class="form-check">

                                  <input class="form-check-input" type="checkbox" id="mobilePhone" name="Telefono movil"
                                    value="Telefono movil">

                                  <label class="form-check-label" for="mobilePhone">

                                    Télefono movil

                                  </label>

                                </div>

                              </div>

                            </div>

                          </div>

                        </div>


                        <!-- Link -->
                        <div class="mb-3">

                          <label class="form-label">
                            Enlace de compra
                          </label>

                          <input type="text" class="form-control" name="link" required
                            placeholder="Enlace de compra del jeugo">

                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>


              <!-- Step 3 -->

              <div class="tab-content mt-4">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Imágenes
                        </h2>


                        <div class="mb-3">

                          <label class="form-label">
                            Caratula del jeugo
                          </label>

                          <input type="file" class="form-control" name="imagen" accept="image/*">

                        </div>

                        <div class="mb-3">

                          <label class="form-label">
                            Escenas del juego
                          </label>

                          <input type="file" class="form-control" name="imagenes[]" accept="image/*" multiple>

                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>


              <!-- Step 4 -->

              <div class="tab-content mt-4">
                <div class="card content">
                  <div class="row justify-content-center">
                    <div class="col-md-12">
                      <div class="card-body p-10">

                        <h2 class="mb-3">
                          Confirmación
                        </h2>


                        <div class="alert alert-info">

                          Revisa los datos antes de enviar el formulario.

                        </div>


                        <div class="form-check mb-4 ">

                          <input class="form-check-input" type="checkbox" id="aceptar" name="aceptar" required>

                          <label class="form-check-label" for="aceptar">

                            Acepto los términos y condiciones

                          </label>

                          <div class="d-flex justify-content-between mt-4">

                            <button type="reset" class="btn btn-secondary" data-bs-toggle="pill"
                              data-bs-target="#step3">

                              Limpiar

                            </button>

                            <button type="submit" class="btn btn-success">

                              Enviar

                            </button>

                          </div>

                        </div>

                      </div>
                    </div>
                  </div>
                </div>
              </div>


            </div>
            <!-- Fin tab-content -->


          </div>
          <!-- Fin card-body -->

        </div>
        <!-- Fin col-md-8 -->

    </div>
    <!-- Fin row -->
    </form>

  </div>
  <!-- Fin container -->

  </div>

</body>
